name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and build
        shell: pwsh
        run: ./scripts/setup.ps1 -Python (Get-Command python).Source
      # Avoid competing Windows process-start/SQLite fixtures across test files.
      # Individual tests still exercise multi-request concurrency and deadlines.
      - run: node --test --test-concurrency=1 tests/*.test.js
      - run: npm.cmd run check
      - name: Python tests
        run: .venv/Scripts/python.exe -X utf8 -m unittest discover -s tests -p "test_*.py"
